name: Deploy to OVH

on:
  push:
    branches: [main]
    # Only what is published triggers a deploy: generated pages land in site/, so observatory/ (data,
    # catalogs, translations) does not trigger one by itself.
    # observatory/daily/*.json (GTM-23) is outside these paths on purpose: the daily synopsis never asks for a deploy;
    # the rosmarops-daily mu-plugin fetches it from the public repository.
    paths: ["site/**", "wp/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Albert approves each deploy in this environment (required reviewer).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          set -eu
          # Only these files are published. Nothing else on the server is touched or deleted.
          ls -l site/index.html site/es/index.html site/llms.txt site/assets/consent/* site/assets/brand/* site/assets/methodology/* wp/htaccess-https.txt wp/htaccess-slash.txt wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-seo.php
          php -l wp/mu-plugins/rosmarops-downloads.php
          php -l wp/mu-plugins/rosmarops-daily.php
          ls -l wp/daily/shell-en.html wp/daily/shell-es.html wp/daily/shell-ca.html wp/daily/i18n.json
          ! grep -RIl 'noindex' site/index.html site/es/index.html site/methodology site/faq site/es/metodologia site/es/preguntas-frecuentes site/ca/index.html site/ca/metodologia site/ca/preguntes-frequents site/cloud-access site/es/acceso-en-la-nube site/ca/acces-al-nuvol site/ca/privadesa site/macos site/es/macos site/ca/macos site/sample-report/index.html site/es/informe-de-ejemplo site/ca/informe-dexemple site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html
          # Observatory: only the three index pages and the JSON files are published (GTM-11). Agent pages wait for verification.
          ls site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html site/observatory/*.json

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_HOSTKEY: ${{ vars.OVH_SFTP_HOSTKEY }}
        run: |
          set -eu
          # Trim stray spaces or line breaks pasted into the variables.
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          # Host key pinned in a repository variable, so a spoofed server is refused.
          # First run: if the variable has no key yet (empty or a placeholder), print the server key and stop,
          # so it can be checked and saved as OVH_SFTP_HOSTKEY.
          if ! printf %s "$SFTP_HOSTKEY" | grep -q "ssh-"; then
            ssh-keyscan -t ed25519,rsa "$SFTP_HOST" 2>/dev/null | tee /tmp/hk
            ssh-keygen -lf /tmp/hk
            echo "::error::OVH_SFTP_HOSTKEY has no key yet. Check the fingerprint above and save the key line as that variable."
            exit 1
          fi
          printf '%s\n' "$SFTP_HOSTKEY" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          # Only these files are uploaded. No delete, no mirror.
          cat > /tmp/batch <<BATCH
          cd $SFTP_PATH
          put site/index.html index.html
          -mkdir es
          put site/es/index.html es/index.html
          put site/llms.txt llms.txt
          put site/sitemap-pages.xml sitemap-pages.xml
          put site/24a8c2078ff9b0ee590acf6cd5901e32.txt 24a8c2078ff9b0ee590acf6cd5901e32.txt
          -mkdir methodology
          put site/methodology/index.html methodology/index.html
          -mkdir faq
          put site/faq/index.html faq/index.html
          -mkdir cloud-access
          put site/cloud-access/index.html cloud-access/index.html
          -mkdir es/metodologia
          put site/es/metodologia/index.html es/metodologia/index.html
          -mkdir es/preguntas-frecuentes
          put site/es/preguntas-frecuentes/index.html es/preguntas-frecuentes/index.html
          -mkdir es/acceso-en-la-nube
          put site/es/acceso-en-la-nube/index.html es/acceso-en-la-nube/index.html
          -mkdir ca
          put site/ca/index.html ca/index.html
          -mkdir ca/metodologia
          put site/ca/metodologia/index.html ca/metodologia/index.html
          -mkdir ca/preguntes-frequents
          put site/ca/preguntes-frequents/index.html ca/preguntes-frequents/index.html
          -mkdir ca/acces-al-nuvol
          put site/ca/acces-al-nuvol/index.html ca/acces-al-nuvol/index.html
          -mkdir ca/privadesa
          put site/ca/privadesa/index.html ca/privadesa/index.html
          -mkdir macos
          put site/macos/index.html macos/index.html
          -mkdir es/macos
          put site/es/macos/index.html es/macos/index.html
          -mkdir ca/macos
          put site/ca/macos/index.html ca/macos/index.html
          -mkdir sample-report
          put site/sample-report/index.html sample-report/index.html
          put site/sample-report/sample-report.en.html sample-report/sample-report.en.html
          put site/sample-report/sample-report.es.html sample-report/sample-report.es.html
          -mkdir es/informe-de-ejemplo
          put site/es/informe-de-ejemplo/index.html es/informe-de-ejemplo/index.html
          -mkdir ca/informe-dexemple
          put site/ca/informe-dexemple/index.html ca/informe-dexemple/index.html
          -mkdir assets
          -mkdir assets/consent
          put site/assets/consent/cookieconsent.umd.js assets/consent/cookieconsent.umd.js
          put site/assets/consent/cookieconsent.css assets/consent/cookieconsent.css
          put site/assets/consent/consent.js assets/consent/consent.js
          put site/assets/consent/LICENSE-cookieconsent.txt assets/consent/LICENSE-cookieconsent.txt
          -mkdir assets/brand
          put site/assets/brand/rosmarops-logo.png assets/brand/rosmarops-logo.png
          put site/assets/brand/rosmarops-logo@2x.png assets/brand/rosmarops-logo@2x.png
          put site/assets/brand/rosmarops-logo.svg assets/brand/rosmarops-logo.svg
          put site/assets/brand/rosmarops-social.png assets/brand/rosmarops-social.png
          -mkdir assets/sample
          put site/assets/sample/sample-desktop.en.png assets/sample/sample-desktop.en.png
          put site/assets/sample/sample-desktop.en@2x.png assets/sample/sample-desktop.en@2x.png
          put site/assets/sample/sample-desktop.es.png assets/sample/sample-desktop.es.png
          put site/assets/sample/sample-desktop.es@2x.png assets/sample/sample-desktop.es@2x.png
          put site/assets/sample/sample-mobile.en.png assets/sample/sample-mobile.en.png
          put site/assets/sample/sample-mobile.en@2x.png assets/sample/sample-mobile.en@2x.png
          put site/assets/sample/sample-mobile.es.png assets/sample/sample-mobile.es.png
          put site/assets/sample/sample-mobile.es@2x.png assets/sample/sample-mobile.es@2x.png
          -mkdir assets/methodology
          put site/assets/methodology/how-rosmarops-works-en-wide.svg assets/methodology/how-rosmarops-works-en-wide.svg
          put site/assets/methodology/how-rosmarops-works-en-narrow.svg assets/methodology/how-rosmarops-works-en-narrow.svg
          put site/assets/methodology/how-rosmarops-works-es-wide.svg assets/methodology/how-rosmarops-works-es-wide.svg
          put site/assets/methodology/how-rosmarops-works-es-narrow.svg assets/methodology/how-rosmarops-works-es-narrow.svg
          put site/assets/methodology/how-rosmarops-works-ca-wide.svg assets/methodology/how-rosmarops-works-ca-wide.svg
          put site/assets/methodology/how-rosmarops-works-ca-narrow.svg assets/methodology/how-rosmarops-works-ca-narrow.svg
          -mkdir assets/brand/observatory
          put site/assets/brand/observatory/observatory-favicon.ico assets/brand/observatory/observatory-favicon.ico
          put site/assets/brand/observatory/observatory-favicon.svg assets/brand/observatory/observatory-favicon.svg
          put site/assets/brand/observatory/observatory-apple-touch-180.png assets/brand/observatory/observatory-apple-touch-180.png
          put site/assets/brand/observatory/observatory-mark.svg assets/brand/observatory/observatory-mark.svg
          put site/assets/brand/observatory/observatory-mark-512.png assets/brand/observatory/observatory-mark-512.png
          put site/assets/brand/observatory/observatory-social.png assets/brand/observatory/observatory-social.png
          -mkdir wp-content/mu-plugins
          put wp/mu-plugins/rosmarops-consent.php wp-content/mu-plugins/rosmarops-consent.php
          put wp/mu-plugins/rosmarops-seo.php wp-content/mu-plugins/rosmarops-seo.php
          put wp/mu-plugins/rosmarops-downloads.php wp-content/mu-plugins/rosmarops-downloads.php
          -mkdir wp-content/mu-plugins/rosmarops-daily
          put wp/daily/shell-en.html wp-content/mu-plugins/rosmarops-daily/shell-en.html
          put wp/daily/shell-es.html wp-content/mu-plugins/rosmarops-daily/shell-es.html
          put wp/daily/shell-ca.html wp-content/mu-plugins/rosmarops-daily/shell-ca.html
          put wp/daily/i18n.json wp-content/mu-plugins/rosmarops-daily/i18n.json
          put wp/mu-plugins/rosmarops-daily.php wp-content/mu-plugins/rosmarops-daily.php
          BATCH
          # Observatory index pages, data files and published agent pages.
          {
            echo "-mkdir observatory"
            echo "put site/observatory/index.html observatory/index.html"
            for f in site/observatory/*.json; do echo "put $f observatory/$(basename "$f")"; done
            echo "-mkdir es/observatorio"
            echo "put site/es/observatorio/index.html es/observatorio/index.html"
            echo "-mkdir ca/observatori"
            echo "put site/ca/observatori/index.html ca/observatori/index.html"
            # Agent pages: only the published ones (no noindex).
            for f in $(find site/observatory site/es/observatorio site/ca/observatori -mindepth 2 -name index.html); do
              if ! grep -q '<meta name="robots" content="noindex">' "$f"; then
                d=$(dirname "${f#site/}")
                echo "-mkdir $d"
                echo "put $f $d/index.html"
              fi
            done
          } >> /tmp/batch
          # The password travels in the SSHPASS environment variable, never on the command line.
          sshpass -e sftp -o BatchMode=no -b /tmp/batch \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST"

      - name: Force HTTPS in .htaccess (once, with automatic rollback)
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          sftp_run() {
            sshpass -e sftp -o BatchMode=no -b "$1" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no \
              "$SFTP_USER@$SFTP_HOST"
          }
          printf 'cd %s\nget .htaccess /tmp/ht.current\n' "$SFTP_PATH" > /tmp/b1
          sftp_run /tmp/b1
          # The file's content is never printed: the repository and its logs are public.
          if grep -q 'BEGIN RosmarOps HTTPS' /tmp/ht.current; then
            echo "HTTPS block already present; nothing to do."
            exit 0
          fi
          { cat wp/htaccess-https.txt; echo; cat /tmp/ht.current; } > /tmp/ht.new
          printf 'cd %s\nput /tmp/ht.current .htaccess.pre-https\nput /tmp/ht.new .htaccess\n' "$SFTP_PATH" > /tmp/b2
          sftp_run /tmp/b2
          sleep 5
          ok=yes
          for u in https://rosmarops.com/ https://rosmarops.com/es/ https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/wp-login.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            echo "$code $u"; [ "$code" = "200" ] || ok=no
          done
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://rosmarops.com/blog/?x=1")
          echo "http -> $loc"; [ "$loc" = "301 https://rosmarops.com/blog/?x=1" ] || ok=no
          if [ "$ok" != yes ]; then
            printf 'cd %s\nput /tmp/ht.current .htaccess\n' "$SFTP_PATH" > /tmp/b3
            sftp_run /tmp/b3
            echo "::error::HTTPS redirect check failed; the previous .htaccess was restored."
            exit 1
          fi

      - name: Folder slash in .htaccess (once, with automatic rollback)
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          sftp_run() {
            sshpass -e sftp -o BatchMode=no -b "$1" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no \
              "$SFTP_USER@$SFTP_HOST"
          }
          printf 'cd %s\nget .htaccess /tmp/ht.current\n' "$SFTP_PATH" > /tmp/b1
          sftp_run /tmp/b1
          # The file's content is never printed: the repository and its logs are public.
          if grep -q 'BEGIN RosmarOps SLASH' /tmp/ht.current; then
            echo "Slash block already present; nothing to do."
            exit 0
          fi
          { cat wp/htaccess-slash.txt; echo; cat /tmp/ht.current; } > /tmp/ht.new
          printf 'cd %s\nput /tmp/ht.current .htaccess.pre-slash\nput /tmp/ht.new .htaccess\n' "$SFTP_PATH" > /tmp/b2
          sftp_run /tmp/b2
          sleep 5
          ok=yes
          for u in https://rosmarops.com/ https://rosmarops.com/es/ https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/wp-login.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            echo "$code $u"; [ "$code" = "200" ] || ok=no
          done
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://rosmarops.com/blog/?x=1")
          echo "http -> $loc"; [ "$loc" = "301 https://rosmarops.com/blog/?x=1" ] || ok=no
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://rosmarops.com/faq")
          echo "slash -> $loc"; [ "$loc" = "301 https://rosmarops.com/faq/" ] || ok=no
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://rosmarops.com/cloud-access")
          echo "slash -> $loc"; [ "$loc" = "301 https://rosmarops.com/cloud-access/" ] || ok=no
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://rosmarops.com/es/acceso-en-la-nube")
          echo "slash -> $loc"; [ "$loc" = "301 https://rosmarops.com/es/acceso-en-la-nube/" ] || ok=no
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://rosmarops.com/ca/acces-al-nuvol")
          echo "slash -> $loc"; [ "$loc" = "301 https://rosmarops.com/ca/acces-al-nuvol/" ] || ok=no
          if [ "$ok" != yes ]; then
            printf 'cd %s\nput /tmp/ht.current .htaccess\n' "$SFTP_PATH" > /tmp/b3
            sftp_run /tmp/b3
            echo "::error::Slash redirect check failed; the previous .htaccess was restored."
            exit 1
          fi

      - name: Verify live
        run: |
          set -eu
          sleep 5
          for u in https://rosmarops.com/ https://rosmarops.com/es/ https://rosmarops.com/llms.txt https://rosmarops.com/methodology/ https://rosmarops.com/faq/ https://rosmarops.com/es/metodologia/ https://rosmarops.com/es/preguntas-frecuentes/ https://rosmarops.com/ca/ https://rosmarops.com/ca/metodologia/ https://rosmarops.com/ca/preguntes-frequents/ https://rosmarops.com/ca/privadesa/ https://rosmarops.com/sitemap-pages.xml https://rosmarops.com/observatory/ https://rosmarops.com/es/observatorio/ https://rosmarops.com/ca/observatori/ https://rosmarops.com/observatory/data.json https://rosmarops.com/observatory/claude-code/ https://rosmarops.com/es/observatorio/cursor/ https://rosmarops.com/ca/observatori/kanvas/ https://rosmarops.com/macos/ https://rosmarops.com/es/macos/ https://rosmarops.com/ca/macos/ https://rosmarops.com/sample-report/ https://rosmarops.com/es/informe-de-ejemplo/ https://rosmarops.com/ca/informe-dexemple/ https://rosmarops.com/sample-report/sample-report.en.html https://rosmarops.com/sample-report/sample-report.es.html https://rosmarops.com/cloud-access/ https://rosmarops.com/es/acceso-en-la-nube/ https://rosmarops.com/ca/acces-al-nuvol/ https://rosmarops.com/assets/methodology/how-rosmarops-works-en-wide.svg https://rosmarops.com/assets/methodology/how-rosmarops-works-en-narrow.svg https://rosmarops.com/assets/methodology/how-rosmarops-works-es-wide.svg https://rosmarops.com/assets/methodology/how-rosmarops-works-es-narrow.svg https://rosmarops.com/assets/methodology/how-rosmarops-works-ca-wide.svg https://rosmarops.com/assets/methodology/how-rosmarops-works-ca-narrow.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u?deploy=${GITHUB_SHA::7}")
            echo "$code $u"; test "$code" = "200"
          done
          curl -s "https://rosmarops.com/?deploy=${GITHUB_SHA::7}" | cmp -s - site/index.html && echo "home EN matches" || (echo "home EN differs from repo"; exit 1)
          for f in observatory/index.html es/observatorio/index.html ca/observatori/index.html observatory/data.json; do
            curl -s "https://rosmarops.com/$f?deploy=${GITHUB_SHA::7}" | cmp -s - "site/$f" && echo "$f matches" || (echo "$f differs from repo"; exit 1)
          done
          for f in assets/brand/observatory/observatory-favicon.ico assets/brand/observatory/observatory-favicon.svg assets/brand/observatory/observatory-apple-touch-180.png assets/brand/observatory/observatory-social.png; do
            curl -s "https://rosmarops.com/$f?deploy=${GITHUB_SHA::7}" | cmp -s - "site/$f" && echo "$f matches" || (echo "$f differs from repo"; exit 1)
          done
          for f in assets/consent/cookieconsent.umd.js assets/consent/cookieconsent.css assets/consent/consent.js assets/brand/rosmarops-logo.png assets/brand/rosmarops-logo@2x.png assets/brand/rosmarops-social.png; do
            curl -s "https://rosmarops.com/$f?deploy=${GITHUB_SHA::7}" | cmp -s - "site/$f" && echo "$f matches" || (echo "$f differs from repo"; exit 1)
          done
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/; do
            ok=no
            for i in 1 2 3 4 5 6; do
              if curl -s "$u?deploy=${GITHUB_SHA::7}-$i" | grep -q 'https://rosmarops.com/assets/consent/consent.js'; then ok=yes; break; fi
              sleep 10
            done
            test "$ok" = yes && echo "banner loaded on $u" || (echo "banner missing on $u"; exit 1)
          done
          curl -s "https://rosmarops.com/robots.txt?deploy=${GITHUB_SHA::7}" | grep -q 'Sitemap: https://rosmarops.com/es/sitemap.xml' && echo "robots lists ES sitemap" || (echo "robots.txt lacks the ES sitemap"; exit 1)
          curl -s "https://rosmarops.com/robots.txt?deploy=${GITHUB_SHA::7}" | grep -q 'Sitemap: https://rosmarops.com/ca/sitemap.xml' && echo "robots lists CA sitemap" || (echo "robots.txt lacks the CA sitemap"; exit 1)
          curl -s "https://rosmarops.com/blog/my-machine-scored-18-of-100/?deploy=${GITHUB_SHA::7}" | grep -q '"@type":"BlogPosting"' && echo "BlogPosting present" || (echo "BlogPosting missing"; exit 1)
          # Download counter (GTM-18): HEAD is redirected but never counted, so these checks add nothing to the counts.
          for u in /download /es/descargar /ca/descarregar; do
            h=$(curl -sI "https://rosmarops.com$u?from=home" | tr -d '\r')
            echo "$h" | grep -q '^HTTP/[0-9.]* 302' && echo "$h" | grep -qi '^location: https://github.com/qtorb/rosmarops/releases/latest$' && echo "$h" | grep -qi '^cache-control: no-store' && echo "$u redirects" || (echo "$u does not redirect to the latest release"; exit 1)
          done
          # Direct download (2026-10-29 decision): ?os=windows goes to the .exe of the latest release.
          h=$(curl -sI "https://rosmarops.com/download?from=home&os=windows" | tr -d '\r')
          echo "$h" | grep -q '^HTTP/[0-9.]* 302' && echo "$h" | grep -qi '^location: https://github.com/qtorb/rosmarops/releases/latest/download/rosmarops.exe$' && echo "$h" | grep -qi '^cache-control: no-store' && echo "/download?os=windows redirects to the .exe" || (echo "/download?os=windows does not redirect to the .exe"; exit 1)
          curl -s "https://rosmarops.com/wp-json/rosmarops/v1/downloads?deploy=${GITHUB_SHA::7}" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert set(d)=={"generated_at","rows"} and isinstance(d["rows"],list); print("downloads endpoint ok,", len(d["rows"]), "rows")'
          # Daily synopsis (GTM-23): index pages, RSS and the slash redirect, served by the rosmarops-daily mu-plugin.
          check_page() {
            out=$(curl -s -w '\n%{http_code}' "https://rosmarops.com$1?deploy=${GITHUB_SHA::7}")
            test "$(printf %s "$out" | tail -n1)" = 200 && printf %s "$out" | grep -qF "$2" && echo "$1 ok" || (echo "$1 missing or without «$2»"; exit 1)
          }
          check_page /observatory/daily/ "Agent security, day by day"
          check_page /es/observatorio/diario/ "La seguridad de los agentes, día a día"
          check_page /ca/observatori/diari/ "La seguretat dels agents, dia a dia"
          h=$(curl -sI "https://rosmarops.com/observatory/daily/feed.xml?deploy=${GITHUB_SHA::7}" | tr -d '\r')
          echo "$h" | grep -q '^HTTP/[0-9.]* 200' && echo "$h" | grep -qi '^content-type: application/rss+xml' && echo "daily feed ok" || (echo "daily feed missing"; exit 1)
          h=$(curl -sI "https://rosmarops.com/observatory/daily" | tr -d '\r')
          echo "$h" | grep -q '^HTTP/[0-9.]* 301' && echo "$h" | grep -qi '^location: https://rosmarops.com/observatory/daily/$' && echo "daily slash redirect ok" || (echo "daily slash redirect wrong"; exit 1)
          # GTM-21: linked founder on the homes, llms.txt entries, download routes out of robots.
          curl -s "https://rosmarops.com/ca/?deploy=${GITHUB_SHA::7}" | grep -q '"@id": "https://rosmarops.com/#founder"' && echo "CA founder ok" || (echo "CA home lacks #founder"; exit 1)
          curl -s "https://rosmarops.com/llms.txt?deploy=${GITHUB_SHA::7}" | grep -q '/blog/rosmarops-is-out/' && echo "llms.txt ok" || (echo "llms.txt lacks the launch post"; exit 1)
          curl -s "https://rosmarops.com/robots.txt?deploy=${GITHUB_SHA::7}" | grep -q '^Disallow: /download$' && echo "robots disallows /download" || (echo "robots.txt lacks Disallow: /download"; exit 1)
          # Nothing from Google may be in the HTML before consent.
          for u in https://rosmarops.com/ https://rosmarops.com/es/ https://rosmarops.com/blog/ https://rosmarops.com/es/blog/; do
            ! curl -s "$u?deploy=${GITHUB_SHA::7}" | grep -q 'googletagmanager.com/gtag' || (echo "Google tag in HTML of $u"; exit 1)
          done

      - name: Tell Bing and other IndexNow engines what changed (best effort)
        continue-on-error: true
        run: |
          set -eu
          # Public key by design: https://www.indexnow.org/documentation. Only page addresses are sent.
          KEY=24a8c2078ff9b0ee590acf6cd5901e32
          urls=$( { echo https://rosmarops.com/; echo https://rosmarops.com/es/; echo https://rosmarops.com/ca/; echo https://rosmarops.com/llms.txt; grep -o '<loc>[^<]*</loc>' site/sitemap-pages.xml | sed 's/<[^>]*>//g'; } | sort -u | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))' )
          body=$(printf '{"host":"rosmarops.com","key":"%s","keyLocation":"https://rosmarops.com/%s.txt","urlList":%s}' "$KEY" "$KEY" "$urls")
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow: HTTP $code for $(printf %s "$urls" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') URLs"

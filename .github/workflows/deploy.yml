          put wp/drafts/novedades-0-10-es.json wp-content/mu-plugins/rosmarops-drafts/novedades-0-10-es.json
          put wp/drafts/novedades-0-10-ca.html wp-content/mu-plugins/rosmarops-drafts/novedades-0-10-ca.html
          put wp/drafts/novedades-0-10-ca.json wp-content/mu-plugins/rosmarops-drafts/novedades-0-10-ca.json
          put wp/mu-plugins/rosmarops-category-loop-engineering.php wp-content/mu-plugins/rosmarops-category-loop-engineering.php
          put wp/mu-plugins/rosmarops-gtm124-agente.php wp-content/mu-plugins/rosmarops-gtm124-agente.php
          put wp/mu-plugins/rosmarops-schedule-he-terminado.php wp-content/mu-plugins/rosmarops-schedule-he-terminado.php
          -mkdir wp-content/mu-plugins/rosmarops-daily
          put wp/daily/shell-en.html wp-content/mu-plugins/rosmarops-daily/shell-en.html
          put wp/daily/shell-es.html wp-content/mu-plugins/rosmarops-daily/shell-es.html
          put wp/daily/shell-ca.html wp-content/mu-plugins/rosmarops-daily/shell-ca.html
          put wp/daily/i18n.json wp-content/mu-plugins/rosmarops-daily/i18n.json
          put wp/mu-plugins/rosmarops-daily.php wp-content/mu-plugins/rosmarops-daily.php
          BATCH
          # Observatory index pages, data files and published agent pages.
          {
            echo "-mkdir observatory"
            echo "put site/observatory/index.html observatory/index.html"
            for f in site/observatory/*.json; do echo "put $f observatory/$(basename "$f")"; done
            echo "-mkdir es/observatorio"
            echo "put site/es/observatorio/index.html es/observatorio/index.html"
            echo "-mkdir ca/observatori"
            echo "put site/ca/observatori/index.html ca/observatori/index.html"
            # GTM-138: the map, hidden (noindex, out of the sitemap, linked from nowhere), uploaded by name.
            echo "-mkdir observatory/ai-agent-map"
            echo "put site/observatory/ai-agent-map/index.html observatory/ai-agent-map/index.html"
            echo "-mkdir es/observatorio/mapa-agentes-ia"
            echo "put site/es/observatorio/mapa-agentes-ia/index.html es/observatorio/mapa-agentes-ia/index.html"
            echo "-mkdir ca/observatori/mapa-agents-ia"
            echo "put site/ca/observatori/mapa-agents-ia/index.html ca/observatori/mapa-agents-ia/index.html"
            # Agent pages: only the published ones (no noindex).
            for f in $(find site/observatory site/es/observatorio site/ca/observatori -mindepth 2 -name index.html); do
              if ! grep -q '<meta name="robots" content="noindex">' "$f"; then
                d=$(dirname "${f#site/}")
                echo "-mkdir $d"
                echo "put $f $d/index.html"
              fi
            done
          } >> /tmp/batch
          # GTM-125: the one-time IP check is over; its token file leaves the server.
          echo "-rm wp-content/rosmarops-private/ipcheck-token.php" >> /tmp/batch
          # The password travels in the SSHPASS environment variable, never on the command line.
          sshpass -e sftp -o BatchMode=no -b /tmp/batch \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST"

      - name: Force HTTPS in .htaccess (once, with automatic rollback)
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          sftp_run() {
            sshpass -e sftp -o BatchMode=no -b "$1" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no \
              "$SFTP_USER@$SFTP_HOST"
          }

          put site/assets/sample/sample-thumb-mobile.en.png assets/sample/sample-thumb-mobile.en.png
          put site/assets/sample/sample-thumb-mobile.en@2x.png assets/sample/sample-thumb-mobile.en@2x.png
          put site/assets/sample/sample-thumb-mobile.es.png assets/sample/sample-thumb-mobile.es.png
          put site/assets/sample/sample-thumb-mobile.es@2x.png assets/sample/sample-thumb-mobile.es@2x.png
          -mkdir assets/methodology

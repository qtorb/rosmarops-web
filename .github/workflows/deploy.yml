          for c in /es/blog/category/nota-de-exposicion/ /blog/category/agent-posture-score/ /ca/blog/category/nota-dexposicio/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com$c?gtm94=${GITHUB_SHA::7}")
            echo "$code $c"; test "$code" = "200"
          done


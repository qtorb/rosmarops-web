          put site/sample-report/sample-report.es.html sample-report/sample-report.es.html
          -mkdir es/informe-de-ejemplo
          put site/es/informe-de-ejemplo/index.html es/informe-de-ejemplo/index.html
          -mkdir ca/informe-dexemple
          put site/ca/informe-dexemple/index.html ca/informe-dexemple/index.html
          -mkdir glossary
          put site/glossary/index.html glossary/index.html
          -mkdir es/glosario
          put site/es/glosario/index.html es/glosario/index.html
          -mkdir ca/glossari
          put site/ca/glossari/index.html ca/glossari/index.html
          -mkdir assets
          -mkdir assets/consent
          put site/assets/consent/cookieconsent.umd.js assets/consent/cookieconsent.umd.js
          put site/assets/consent/cookieconsent.css assets/consent/cookieconsent.css
          put site/assets/consent/consent.js assets/consent/consent.js
          put site/assets/consent/LICENSE-cookieconsent.txt assets/consent/LICENSE-cookieconsent.txt
          -mkdir assets/visits

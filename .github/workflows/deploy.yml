name: Deploy to OVH

on:
  push:
    branches: [main]
    # Only what is published triggers a deploy: generated pages land in site/, so observatory/ (data,
    # catalogs, translations) does not trigger one by itself.
    # observatory/daily/*.json (GTM-23) is outside these paths on purpose: the daily synopsis never asks for a deploy;
    # the rosmarops-daily mu-plugin fetches it from the public repository.
    paths: ["site/**", "wp/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Albert approves each deploy in this environment (required reviewer).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          set -eu
          # Only these files are published. Nothing else on the server is touched or deleted.
          ls -l site/index.html site/es/index.html site/llms.txt site/assets/consent/* site/assets/visits/* site/assets/brand/* site/assets/methodology/* site/assets/sandbox-lab/* site/assets/help/* site/assets/star/* site/assets/store/* site/assets/video/* site/glossary/index.html site/es/glosario/index.html site/ca/glossari/index.html wp/htaccess-https.txt wp/htaccess-slash.txt wp/htaccess-static.txt site/_static/* wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-seo.php
          php -l wp/mu-plugins/rosmarops-downloads.php
          php -l wp/mu-plugins/rosmarops-daily.php
          php -l wp/mu-plugins/rosmarops-retired.php
          php -l wp/mu-plugins/rosmarops-categories-gtm94.php
          php -l wp/mu-plugins/rosmarops-gtm97-drafts.php
          php -l wp/mu-plugins/rosmarops-gtm103-noindex.php
          php -l wp/mu-plugins/rosmarops-blog-drafts.php
          php -l wp/mu-plugins/rosmarops-category-loop-engineering.php
          php -l wp/mu-plugins/rosmarops-gtm124-agente.php
          php -l wp/mu-plugins/rosmarops-papelera-0-16.php
          php -l wp/mu-plugins/rosmarops-gtm198-enlace.php
          php -l wp/mu-plugins/rosmarops-gtm121-titulos.php
          php -l wp/mu-plugins/rosmarops-gtm195-voz.php
          php -l wp/mu-plugins/rosmarops-gtm164-sin-version.php
          php -l wp/mu-plugins/rosmarops-gtm181-promesa.php
          php -l wp/mu-plugins/rosmarops-schedule-he-terminado.php
          php -l wp/mu-plugins/rosmarops-schedule-microsoft-store.php
          php -l wp/mu-plugins/rosmarops-store-image.php
          php -l wp/mu-plugins/rosmarops-schedule-mapa.php
          php -l wp/mu-plugins/rosmarops-schedule-novedades-0-11.php
          php -l wp/mu-plugins/rosmarops-slug-sandbox.php
          php -l wp/mu-plugins/rosmarops-menu-sandbox.php
          php -l wp/mu-plugins/rosmarops-menu8-sandbox.php
          php -l wp/mu-plugins/rosmarops-menu9-sandbox.php
          php -l wp/mu-plugins/rosmarops-menu10-academy.php
          php -l wp/mu-plugins/rosmarops-slug7-sandbox.php
          ls -l wp/drafts/*.json wp/drafts/*.html wp/drafts/rosmarops-img-13-loop-engineering.jpg wp/drafts/rosmarops-img-14-he-terminado.jpg wp/drafts/rosmarops-img-15-el-sistema-aprende.jpg wp/drafts/rosmarops-img-17-harness-engineering.jpg wp/drafts/rosmarops-img-16-novedades-0-10.jpg wp/drafts/rosmarops-img-18-microsoft-store.jpg wp/drafts/rosmarops-img-19-tres-blocs.jpg wp/drafts/rosmarops-img-20-worktree.jpg wp/drafts/video-decide-*.jpg wp/drafts/rosmarops-img-22-semana-en-agentes.jpg wp/drafts/rosmarops-img-24-ajustes-claude-code.jpg wp/drafts/rosmarops-img-23-aceptarlo-todo.jpg wp/drafts/sandbox-agentes-de-ia.jpg wp/drafts/agentes-en-el-ordenador-del-fabricante-es.jpg wp/drafts/agents-on-the-vendors-computer-en.jpg wp/drafts/agents-a-lordinador-del-fabricant-ca.jpg wp/drafts/orquestadores-y-automatizacion-es.jpg wp/drafts/orchestrators-and-automation-en.jpg wp/drafts/orquestradors-i-automatitzacio-ca.jpg wp/drafts/aviso-a-n8n-es.jpg wp/drafts/notice-to-n8n-en.jpg wp/drafts/avis-a-n8n-ca.jpg
          ls -l wp/daily/shell-en.html wp/daily/shell-es.html wp/daily/shell-ca.html wp/daily/i18n.json
          ! grep -RIl 'noindex' site/index.html site/es/index.html site/methodology site/faq site/es/metodologia site/es/preguntas-frecuentes site/ca/index.html site/ca/metodologia site/ca/preguntes-frequents site/cloud-access site/es/acceso-en-la-nube site/ca/acces-al-nuvol site/ca/privadesa site/privacy site/es/privacidad site/legal-notice site/es/aviso-legal site/ca/avis-legal site/terms site/es/terminos site/ca/termes site/security-teams site/es/equipos-de-seguridad site/ca/equips-de-seguretat site/_static site/macos site/es/macos site/ca/macos site/linux site/es/linux site/ca/linux site/sample-report/index.html site/es/informe-de-ejemplo site/ca/informe-dexemple site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html site/glossary site/es/glosario site/ca/glossari site/observatory/ai-agent-map site/es/observatorio/mapa-agentes-ia site/ca/observatori/mapa-agents-ia site/observatory/ai-agents-with-sandbox site/es/observatorio/agentes-ia-con-sandbox site/ca/observatori/agents-ia-amb-sandbox site/try-an-ai-agent site/es/probar-un-agente-de-ia site/ca/provar-un-agent-dia site/sandbox site/es/sandbox site/ca/sandbox site/agent-orchestrators site/es/orquestadores-de-agentes site/ca/orquestradors-dagents site/claude-code-subagents site/es/subagentes-de-claude-code site/ca/subagents-de-claude-code site/mcp-servers site/es/servidores-mcp site/ca/servidors-mcp
          # GTM-230: RosmarOps Academy and the course lessons follow one switch ("open" in observatory/data/academy.json).
          # Closed: no Academy page, lessons noindex and out of the sitemap, every header menu as before. Open: the opposite.
          python3 observatory/academy.py --check-site
          test ! -e site/course/index.html && test ! -e site/es/curso/index.html && test ! -e site/ca/curs/index.html
          # Observatory: only the three index pages and the JSON files are published (GTM-11). Agent pages wait for verification.
          ls site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html site/observatory/*.json

      - name: The web agrees with the agent files and the program's latest release (GTM-99)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 observatory/agent_lists.py check

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_HOSTKEY: ${{ vars.OVH_SFTP_HOSTKEY }}
        run: |
          set -eu
          # Trim stray spaces or line breaks pasted into the variables.
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          # Host key pinned in a repository variable, so a spoofed server is refused.
          # First run: if the variable has no key yet (empty or a placeholder), print the server key and stop,
          # so it can be checked and saved as OVH_SFTP_HOSTKEY.
          if ! printf %s "$SFTP_HOSTKEY" | grep -q "ssh-"; then
            ssh-keyscan -t ed25519,rsa "$SFTP_HOST" 2>/dev/null | tee /tmp/hk
            ssh-keygen -lf /tmp/hk
            echo "::error::OVH_SFTP_HOSTKEY has no key yet. Check the fingerprint above and save the key line as that variable."
            exit 1
          fi
          printf '%s\n' "$SFTP_HOSTKEY" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          # Only these files are uploaded. No delete, no mirror.
          cat > /tmp/batch <<BATCH
          cd $SFTP_PATH
          put site/index.html index.html
          -mkdir es
          put site/es/index.html es/index.html
          put site/llms.txt llms.txt
          put site/sitemap-pages.xml sitemap-pages.xml
          put site/24a8c2078ff9b0ee590acf6cd5901e32.txt 24a8c2078ff9b0ee590acf6cd5901e32.txt
          put site/google5cd09a19ba35efb6.html google5cd09a19ba35efb6.html
          -mkdir methodology
          put site/methodology/index.html methodology/index.html
          -mkdir faq
          put site/faq/index.html faq/index.html
          -mkdir cloud-access
          put site/cloud-access/index.html cloud-access/index.html
          -mkdir es/metodologia
          put site/es/metodologia/index.html es/metodologia/index.html
          -mkdir es/preguntas-frecuentes
          put site/es/preguntas-frecuentes/index.html es/preguntas-frecuentes/index.html
          -mkdir es/acceso-en-la-nube
          put site/es/acceso-en-la-nube/index.html es/acceso-en-la-nube/index.html
          -mkdir ca
          put site/ca/index.html ca/index.html
          -mkdir ca/metodologia
          put site/ca/metodologia/index.html ca/metodologia/index.html
          -mkdir ca/preguntes-frequents
          put site/ca/preguntes-frequents/index.html ca/preguntes-frequents/index.html
          -mkdir ca/acces-al-nuvol
          put site/ca/acces-al-nuvol/index.html ca/acces-al-nuvol/index.html
          -mkdir ca/privadesa
          put site/ca/privadesa/index.html ca/privadesa/index.html
          -mkdir _static
          put site/_static/about-en.html _static/about-en.html
          put site/_static/about-es.html _static/about-es.html
          put site/_static/about-ca.html _static/about-ca.html
          -mkdir privacy
          put site/privacy/index.html privacy/index.html
          -mkdir es/privacidad
          put site/es/privacidad/index.html es/privacidad/index.html
          -mkdir legal-notice
          put site/legal-notice/index.html legal-notice/index.html
          -mkdir es/aviso-legal
          put site/es/aviso-legal/index.html es/aviso-legal/index.html
          -mkdir ca/avis-legal
          put site/ca/avis-legal/index.html ca/avis-legal/index.html
          -mkdir terms

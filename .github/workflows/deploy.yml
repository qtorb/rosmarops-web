          test "$left" = 0
          # The sitemap must have been rebuilt after the migration ran (it clears The SEO Framework's sitemap cache
          # once). Only the deploy that runs the migration sees it rebuilt that same day; later deploys find the cached
          # sitemap from that day or after, which is right: the date to compare with is the migration's, from its log.
          run_day=$(sed -n '1s/^GTM-97 retired posts to draft, site es, \([0-9-]*\) .*/\1/p' /tmp/gtm97/gtm97-es.log 2>/dev/null || true)
          map_day=$(grep -o 'generado el [0-9-]*' /tmp/es-sitemap.xml | head -1 | sed 's/generado el //' || true)
          echo "migration ran: ${run_day:-unknown}; ES sitemap generated: ${map_day:-unknown}"
          if [ -z "$run_day" ]; then echo "::warning::GTM-97 log without its run date; sitemap date not checked"; exit 0; fi
          [ -n "$map_day" ] && [ ! "$map_day" \< "$run_day" ] && echo "ES sitemap rebuilt after the migration" || (echo "::error::ES sitemap older than the GTM-97 migration ($map_day < $run_day)"; exit 1)

      - name: GTM-103 legacy posts and old categories to noindex (one time, /es/), its log and the check from outside
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # The migration runs on the first request to /es/ after the upload; once done it never runs again.
          curl -s -o /dev/null -w "%{http_code} /es/blog/\n" "https://rosmarops.com/es/blog/?gtm103=${GITHUB_SHA::7}"
          sleep 5
          mkdir -p /tmp/gtm103
          printf 'cd %s/wp-content/rosmarops-private\n-get gtm103-es.log /tmp/gtm103/\n' "$SFTP_PATH" > /tmp/b103
          sshpass -e sftp -o BatchMode=no -b /tmp/b103 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          if [ ! -f /tmp/gtm103/gtm103-es.log ]; then echo "::warning::gtm103-es.log not found"; exit 0; fi
          echo "--- gtm103-es.log"; cat /tmp/gtm103/gtm103-es.log
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/gtm103-es.log")
          [ "$code" != "200" ] && echo "log folder closed to the web ($code)" || (echo "::error::the migration log is reachable from the web"; exit 1)
          if grep -q '^stopped:' /tmp/gtm103/gtm103-es.log; then echo "::warning::GTM-103 stopped without changes; see the log"; exit 0; fi
          # Every legacy post now says noindex and has left the Spanish sitemap.
          curl -s "https://rosmarops.com/es/sitemap.xml?gtm103=${GITHUB_SHA::7}" > /tmp/es-sitemap-103.xml
          bad=0
          for s in $(sed -n -e 's/^post done: \([a-z0-9-]*\) noindex$/\1/p' -e 's/^skipped: post \([a-z0-9-]*\) is already noindex$/\1/p' /tmp/gtm103/gtm103-es.log); do
            curl -s "https://rosmarops.com/es/blog/$s/?gtm103=${GITHUB_SHA::7}" | grep -qi '<meta name="robots" content="[^"]*noindex' || { echo "not noindex: $s"; bad=$((bad+1)); }
            grep -q "/es/blog/$s/<" /tmp/es-sitemap-103.xml && { echo "still in the sitemap: $s"; bad=$((bad+1)); }
          done
          echo "legacy posts with a problem: $bad"
          test "$bad" = 0

      - name: Blog drafts and the Loop engineering category (one time per site), their logs and the drafts' future addresses
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # rosmarops-blog-drafts.php creates each pending draft on the first request to its site; Albert publishes.
          # Since 09-11 it also puts each new draft in its category, adds its tags and sets its featured image.
          # rosmarops-category-loop-engineering.php then creates the category on that site, puts the draft in it and
          # sets its featured image (once per site).
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/ca/blog/; do
            curl -s -o /dev/null -w "%{http_code} $u\n" "$u?drafts=${GITHUB_SHA::7}"
          done
          sleep 5
          mkdir -p /tmp/drafts
          printf 'cd %s/wp-content/rosmarops-private\n-get drafts-en.log /tmp/drafts/\n-get drafts-es.log /tmp/drafts/\n-get drafts-ca.log /tmp/drafts/\n-get loopcat-en.log /tmp/drafts/\n-get loopcat-es.log /tmp/drafts/\n-get loopcat-ca.log /tmp/drafts/\n' "$SFTP_PATH" > /tmp/bdr
          sshpass -e sftp -o BatchMode=no -b /tmp/bdr \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          for f in drafts-en drafts-es drafts-ca loopcat-en loopcat-es loopcat-ca; do
            if [ -f "/tmp/drafts/$f.log" ]; then echo "--- $f.log"; cat "/tmp/drafts/$f.log"; else echo "::warning::$f.log not found"; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/$f.log")
            [ "$code" != "200" ] && echo "$f.log closed to the web ($code)" || (echo "::error::$f.log is reachable from the web"; exit 1)
          done
          # Where each post lives: 404 while it is a draft, 200 once published (the loop engineering posts are published by
          # rosmarops-category-loop-engineering.php, asked by Albert on 08-11).
          for f in wp/drafts/*.json; do
            url=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); b={"en":"https://rosmarops.com","es":"https://rosmarops.com/es","ca":"https://rosmarops.com/ca"}[d["lang"]]; print(b + "/blog/" + d["slug"] + "/")' "$f")
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url?drafts=${GITHUB_SHA::7}")
            echo "$code $url"
          done

      - name: GTM-124 «agent» in two credit lines per site and the /blog/ description (one time per site), its logs and the check from outside
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # rosmarops-gtm124-agente.php runs on the first request to each site after the upload; once done it never runs again.
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/ca/blog/; do
            curl -s -o /dev/null -w "%{http_code} $u\n" "$u?gtm124=${GITHUB_SHA::7}"
          done
          sleep 5
          mkdir -p /tmp/gtm124
          printf 'cd %s/wp-content/rosmarops-private\n-get gtm124-en.log /tmp/gtm124/\n-get gtm124-es.log /tmp/gtm124/\n-get gtm124-ca.log /tmp/gtm124/\n' "$SFTP_PATH" > /tmp/b124
          sshpass -e sftp -o BatchMode=no -b /tmp/b124 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          for f in gtm124-en gtm124-es gtm124-ca; do
            if [ -f "/tmp/gtm124/$f.log" ]; then echo "--- $f.log"; cat "/tmp/gtm124/$f.log"; else echo "::warning::$f.log not found"; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/$f.log")
            [ "$code" != "200" ] && echo "$f.log closed to the web ($code)" || (echo "::error::$f.log is reachable from the web"; exit 1)
          done
          if grep -h '^\(skipped\|failed\):' /tmp/gtm124/*.log 2>/dev/null; then echo "::warning::GTM-124 left something alone; see the logs"; fi
          # From outside: each of the six posts no longer has the word.
          bad=0
          for u in https://rosmarops.com/blog/loop-engineering-agents-working-alone/ https://rosmarops.com/blog/what-wasnt-read-doesnt-count-as-clean/ \
                   https://rosmarops.com/es/blog/loop-engineering-agentes-trabajando-solos/ https://rosmarops.com/es/blog/lo-que-no-se-leyo-no-cuenta-como-limpio/ \
                   https://rosmarops.com/ca/blog/loop-engineering-agents-treballant-sols/ https://rosmarops.com/ca/blog/el-que-no-sha-llegit-no-compta-com-a-net/; do
            n=$(curl -s "$u?gtm124=${GITHUB_SHA::7}" | grep -o -i -E 'asistent|assistent|assistant' | wc -l)
            echo "$n $u"; [ "$n" = 0 ] || bad=$((bad+1))
          done
          echo "posts that still have the word: $bad"

      - name: Post 2 of the agents series scheduled for 12-11 06:00 Madrid (one time per site) and its logs
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # rosmarops-schedule-he-terminado.php runs on the first request to each site after the upload; once done it never runs again.
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/ca/blog/; do
            curl -s -o /dev/null -w "%{http_code} $u\n" "$u?sched2=${GITHUB_SHA::7}"
          done
          sleep 5
          mkdir -p /tmp/sched2
          printf 'cd %s/wp-content/rosmarops-private\n-get sched2-en.log /tmp/sched2/\n-get sched2-es.log /tmp/sched2/\n-get sched2-ca.log /tmp/sched2/\n' "$SFTP_PATH" > /tmp/bs2
          sshpass -e sftp -o BatchMode=no -b /tmp/bs2 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          for f in sched2-en sched2-es sched2-ca; do
            if [ -f "/tmp/sched2/$f.log" ]; then echo "--- $f.log"; cat "/tmp/sched2/$f.log"; else echo "::warning::$f.log not found"; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/$f.log")
            [ "$code" != "200" ] && echo "$f.log closed to the web ($code)" || (echo "::error::$f.log is reachable from the web"; exit 1)
          done
          if grep -h '^\(skipped\|failed\):' /tmp/sched2/*.log 2>/dev/null; then echo "::warning::post 2 was not scheduled on some site; see the logs"; fi

      - name: GTM-125 the IP check is gone
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-json/rosmarops/v1/ipcheck?k=$(printf '0%.0s' $(seq 64))")
          echo "ipcheck: $code"; test "$code" = 404

      - name: Tell Bing and other IndexNow engines what changed (best effort)
        continue-on-error: true
        run: |
          set -eu
          # Public key by design: https://www.indexnow.org/documentation. Only page addresses are sent.
          KEY=24a8c2078ff9b0ee590acf6cd5901e32
          urls=$( { echo https://rosmarops.com/; echo https://rosmarops.com/es/; echo https://rosmarops.com/ca/; echo https://rosmarops.com/llms.txt; grep -o '<loc>[^<]*</loc>' site/sitemap-pages.xml | sed 's/<[^>]*>//g'; } | sort -u | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))' )
          body=$(printf '{"host":"rosmarops.com","key":"%s","keyLocation":"https://rosmarops.com/%s.txt","urlList":%s}' "$KEY" "$KEY" "$urls")
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow: HTTP $code for $(printf %s "$urls" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') URLs"

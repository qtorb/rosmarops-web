          curl -s "https://rosmarops.com/es/sitemap.xml?gtm97=${GITHUB_SHA::7}" > /tmp/es-sitemap.xml
          left=0
          while read -r s; do grep -q "/es/blog/$s/<" /tmp/es-sitemap.xml && { echo "still in the sitemap: $s"; left=$((left+1)); }; done < /tmp/retired.txt

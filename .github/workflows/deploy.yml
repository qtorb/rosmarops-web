        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # rosmarops-gtm181-promesa.php runs on the first request to each site after the upload; once done it never runs again.
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/ca/blog/; do
            curl -s -o /dev/null -w "%{http_code} $u\n" "$u?gtm181=${GITHUB_SHA::7}"
          done
          sleep 5
          mkdir -p /tmp/gtm181
          printf 'cd %s/wp-content/rosmarops-private\n-get gtm181-en.log /tmp/gtm181/\n-get gtm181-es.log /tmp/gtm181/\n-get gtm181-ca.log /tmp/gtm181/\n' "$SFTP_PATH" > /tmp/b181
          sshpass -e sftp -o BatchMode=no -b /tmp/b181 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          for f in gtm181-en gtm181-es gtm181-ca; do
            if [ -f "/tmp/gtm181/$f.log" ]; then echo "--- $f.log"; cat "/tmp/gtm181/$f.log"; else echo "::warning::$f.log not found"; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/$f.log")
            [ "$code" != "200" ] && echo "$f.log closed to the web ($code)" || (echo "::error::$f.log is reachable from the web"; exit 1)
          done
          if grep -h '^\(skipped\|failed\):' /tmp/gtm181/*.log 2>/dev/null; then echo "::warning::GTM-181 left something alone; see the logs"; fi
          # From outside: the three policies answer 200 with 0.15.0, and the static pages still answer where WordPress pages went to draft.
          for u in https://rosmarops.com/privacy/app/ https://rosmarops.com/es/privacidad/app/ https://rosmarops.com/ca/privadesa/app/; do
            out=$(curl -s -w '\n%{http_code}' "$u?gtm181=${GITHUB_SHA::7}")
            code=$(printf %s "$out" | tail -n1)
            printf %s "$out" | grep -q '0\.15\.0' && echo "$code $u has 0.15.0" || echo "::warning::$code $u without 0.15.0"
          done
          for u in https://rosmarops.com/ https://rosmarops.com/blog/about/ https://rosmarops.com/es/blog/que-es-rosmarops/ https://rosmarops.com/ca/blog/que-es-rosmarops/ \
                   https://rosmarops.com/privacy/ https://rosmarops.com/es/privacidad/ https://rosmarops.com/ca/privadesa/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u?gtm181=${GITHUB_SHA::7}")
            echo "$code $u"; [ "$code" = 200 ] || echo "::warning::$u answers $code"
          done

      - name: GTM-125 the IP check is gone
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-json/rosmarops/v1/ipcheck?k=$(printf '0%.0s' $(seq 64))")
          echo "ipcheck: $code"; test "$code" = 404

      - name: Tell Bing and other IndexNow engines what changed (best effort)
        continue-on-error: true
        run: |
          set -eu
          # Public key by design: https://www.indexnow.org/documentation. Only page addresses are sent.
          KEY=24a8c2078ff9b0ee590acf6cd5901e32
          urls=$( { echo https://rosmarops.com/; echo https://rosmarops.com/es/; echo https://rosmarops.com/ca/; echo https://rosmarops.com/llms.txt; grep -o '<loc>[^<]*</loc>' site/sitemap-pages.xml | sed 's/<[^>]*>//g'; } | sort -u | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))' )
          body=$(printf '{"host":"rosmarops.com","key":"%s","keyLocation":"https://rosmarops.com/%s.txt","urlList":%s}' "$KEY" "$KEY" "$urls")
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow: HTTP $code for $(printf %s "$urls" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') URLs"

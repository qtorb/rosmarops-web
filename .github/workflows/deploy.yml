          put wp/drafts/harness-engineering-es.html wp-content/mu-plugins/rosmarops-drafts/harness-engineering-es.html
          put wp/drafts/harness-engineering-es.json wp-content/mu-plugins/rosmarops-drafts/harness-engineering-es.json
          put wp/drafts/harness-engineering-ca.html wp-content/mu-plugins/rosmarops-drafts/harness-engineering-ca.html
          put wp/drafts/harness-engineering-ca.json wp-content/mu-plugins/rosmarops-drafts/harness-engineering-ca.json
          put wp/drafts/novedades-0-10-en.html wp-content/mu-plugins/rosmarops-drafts/novedades-0-10-en.html
          put wp/drafts/novedades-0-10-en.json wp-content/mu-plugins/rosmarops-drafts/novedades-0-10-en.json

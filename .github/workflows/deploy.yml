          put wp/mu-plugins/rosmarops-retired.php wp-content/mu-plugins/rosmarops-retired.php
          put wp/mu-plugins/rosmarops-categories-gtm94.php wp-content/mu-plugins/rosmarops-categories-gtm94.php
          put wp/mu-plugins/rosmarops-gtm97-drafts.php wp-content/mu-plugins/rosmarops-gtm97-drafts.php
          put wp/mu-plugins/rosmarops-gtm103-noindex.php wp-content/mu-plugins/rosmarops-gtm103-noindex.php

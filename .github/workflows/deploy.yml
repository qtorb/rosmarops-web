name: Deploy to OVH

on:
  push:
    branches: [main]
    # Only what is published triggers a deploy: generated pages land in site/, so observatory/ (data,
    # catalogs, translations) does not trigger one by itself.
    # observatory/daily/*.json (GTM-23) is outside these paths on purpose: the daily synopsis never asks for a deploy;
    # the rosmarops-daily mu-plugin fetches it from the public repository.
    paths: ["site/**", "wp/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Albert approves each deploy in this environment (required reviewer).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          set -eu
          # Only these files are published. Nothing else on the server is touched or deleted.
          ls -l site/index.html site/es/index.html site/llms.txt site/assets/consent/* site/assets/visits/* site/assets/brand/* site/assets/methodology/* site/assets/help/* site/assets/download/os.js site/assets/store/* site/assets/video/* site/glossary/index.html site/es/glosario/index.html site/ca/glossari/index.html wp/htaccess-https.txt wp/htaccess-slash.txt wp/htaccess-static.txt site/_static/* wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-consent.php
          php -l wp/mu-plugins/rosmarops-seo.php
          php -l wp/mu-plugins/rosmarops-downloads.php
          php -l wp/mu-plugins/rosmarops-daily.php
          php -l wp/mu-plugins/rosmarops-retired.php
          php -l wp/mu-plugins/rosmarops-categories-gtm94.php
          php -l wp/mu-plugins/rosmarops-gtm97-drafts.php
          php -l wp/mu-plugins/rosmarops-gtm103-noindex.php
          php -l wp/mu-plugins/rosmarops-blog-drafts.php
          php -l wp/mu-plugins/rosmarops-category-loop-engineering.php
          php -l wp/mu-plugins/rosmarops-gtm124-agente.php
          php -l wp/mu-plugins/rosmarops-schedule-he-terminado.php
          ls -l wp/drafts/*.json wp/drafts/*.html wp/drafts/rosmarops-img-13-loop-engineering.jpg wp/drafts/rosmarops-img-14-he-terminado.jpg wp/drafts/rosmarops-img-15-el-sistema-aprende.jpg wp/drafts/rosmarops-img-17-harness-engineering.jpg wp/drafts/rosmarops-img-16-novedades-0-10.jpg
          ls -l wp/daily/shell-en.html wp/daily/shell-es.html wp/daily/shell-ca.html wp/daily/i18n.json
          ! grep -RIl 'noindex' site/index.html site/es/index.html site/methodology site/faq site/es/metodologia site/es/preguntas-frecuentes site/ca/index.html site/ca/metodologia site/ca/preguntes-frequents site/cloud-access site/es/acceso-en-la-nube site/ca/acces-al-nuvol site/ca/privadesa site/privacy site/es/privacidad site/legal-notice site/es/aviso-legal site/ca/avis-legal site/terms site/es/terminos site/ca/termes site/security-teams site/es/equipos-de-seguridad site/ca/equips-de-seguretat site/_static site/macos site/es/macos site/ca/macos site/linux site/es/linux site/ca/linux site/sample-report/index.html site/es/informe-de-ejemplo site/ca/informe-dexemple site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html site/glossary site/es/glosario site/ca/glossari
          # Observatory: only the three index pages and the JSON files are published (GTM-11). Agent pages wait for verification.
          ls site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html site/observatory/*.json

      - name: The web agrees with the agent files and the program's latest release (GTM-99)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 observatory/agent_lists.py check

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ vars.OVH_SFTP_HOST }}
          SFTP_USER: ${{ vars.OVH_SFTP_USER }}
          SFTP_PATH: ${{ vars.OVH_SITE_PATH }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_HOSTKEY: ${{ vars.OVH_SFTP_HOSTKEY }}
        run: |
          set -eu
          # Trim stray spaces or line breaks pasted into the variables.
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          # Host key pinned in a repository variable, so a spoofed server is refused.
          # First run: if the variable has no key yet (empty or a placeholder), print the server key and stop,
          # so it can be checked and saved as OVH_SFTP_HOSTKEY.
          if ! printf %s "$SFTP_HOSTKEY" | grep -q "ssh-"; then
            ssh-keyscan -t ed25519,rsa "$SFTP_HOST" 2>/dev/null | tee /tmp/hk
            ssh-keygen -lf /tmp/hk
            echo "::error::OVH_SFTP_HOSTKEY has no key yet. Check the fingerprint above and save the key line as that variable."
            exit 1
          fi
          printf '%s\n' "$SFTP_HOSTKEY" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          # Only these files are uploaded. No delete, no mirror.
          cat > /tmp/batch <<BATCH
          cd $SFTP_PATH
          put site/index.html index.html
          -mkdir es
          put site/es/index.html es/index.html
          put site/llms.txt llms.txt
          put site/sitemap-pages.xml sitemap-pages.xml
          put site/24a8c2078ff9b0ee590acf6cd5901e32.txt 24a8c2078ff9b0ee590acf6cd5901e32.txt
          -mkdir methodology
          put site/methodology/index.html methodology/index.html
          -mkdir faq
          put site/faq/index.html faq/index.html
          -mkdir cloud-access
          put site/cloud-access/index.html cloud-access/index.html
          -mkdir es/metodologia
          put site/es/metodologia/index.html es/metodologia/index.html
          -mkdir es/preguntas-frecuentes
          put site/es/preguntas-frecuentes/index.html es/preguntas-frecuentes/index.html
          -mkdir es/acceso-en-la-nube
          put site/es/acceso-en-la-nube/index.html es/acceso-en-la-nube/index.html
          -mkdir ca
          put site/ca/index.html ca/index.html
          -mkdir ca/metodologia
          put site/ca/metodologia/index.html ca/metodologia/index.html
          -mkdir ca/preguntes-frequents
          put site/ca/preguntes-frequents/index.html ca/preguntes-frequents/index.html
          -mkdir ca/acces-al-nuvol
          put site/ca/acces-al-nuvol/index.html ca/acces-al-nuvol/index.html
          -mkdir ca/privadesa
          put site/ca/privadesa/index.html ca/privadesa/index.html
          -mkdir _static
          put site/_static/about-en.html _static/about-en.html
          put site/_static/about-es.html _static/about-es.html
          put site/_static/about-ca.html _static/about-ca.html
          -mkdir privacy
          put site/privacy/index.html privacy/index.html
          -mkdir es/privacidad
          put site/es/privacidad/index.html es/privacidad/index.html
          -mkdir legal-notice
          put site/legal-notice/index.html legal-notice/index.html
          -mkdir es/aviso-legal
          put site/es/aviso-legal/index.html es/aviso-legal/index.html
          -mkdir ca/avis-legal
          put site/ca/avis-legal/index.html ca/avis-legal/index.html
          -mkdir terms
          put site/terms/index.html terms/index.html
          -mkdir es/terminos
          put site/es/terminos/index.html es/terminos/index.html
          -mkdir ca/termes
          put site/ca/termes/index.html ca/termes/index.html
          -mkdir security-teams
          put site/security-teams/index.html security-teams/index.html
          -mkdir es/equipos-de-seguridad
          put site/es/equipos-de-seguridad/index.html es/equipos-de-seguridad/index.html
          -mkdir ca/equips-de-seguretat
          put site/ca/equips-de-seguretat/index.html ca/equips-de-seguretat/index.html
          -mkdir macos
          put site/macos/index.html macos/index.html
          -mkdir es/macos
          put site/es/macos/index.html es/macos/index.html
          -mkdir ca/macos
          put site/ca/macos/index.html ca/macos/index.html
          -mkdir linux
          put site/linux/index.html linux/index.html
          -mkdir es/linux
          put site/es/linux/index.html es/linux/index.html

        run: |
          set -eu
          SFTP_HOST=$(printf %s "$SFTP_HOST" | tr -d '[:space:]')
          SFTP_USER=$(printf %s "$SFTP_USER" | tr -d '[:space:]')
          SFTP_PATH=$(printf %s "$SFTP_PATH" | tr -d '[:space:]')
          # The migration runs on the first request to each WordPress site after the upload; once done it never runs again.
          for u in https://rosmarops.com/blog/ https://rosmarops.com/es/blog/ https://rosmarops.com/ca/blog/; do
            curl -s -o /dev/null -w "%{http_code} $u\n" "$u?gtm94=${GITHUB_SHA::7}"
          done
          sleep 5
          # The log holds category and post slugs only (public content); it lives in a folder closed to the web.
          mkdir -p /tmp/gtm94
          printf 'cd %s/wp-content/rosmarops-private\n-get gtm94-en.log /tmp/gtm94/\n-get gtm94-es.log /tmp/gtm94/\n-get gtm94-ca.log /tmp/gtm94/\n' "$SFTP_PATH" > /tmp/b94
          sshpass -e sftp -o BatchMode=no -b /tmp/b94 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SFTP_USER@$SFTP_HOST" || true
          for l in en es ca; do
            if [ -f "/tmp/gtm94/gtm94-$l.log" ]; then echo "--- gtm94-$l.log"; cat "/tmp/gtm94/gtm94-$l.log"; else echo "::warning::gtm94-$l.log not found"; fi
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rosmarops.com/wp-content/rosmarops-private/gtm94-es.log")

          put wp/mu-plugins/rosmarops-blog-drafts.php wp-content/mu-plugins/rosmarops-blog-drafts.php
          put wp/drafts/rosmarops-img-13-loop-engineering.jpg wp-content/mu-plugins/rosmarops-drafts/rosmarops-img-13-loop-engineering.jpg

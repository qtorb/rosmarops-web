          put site/assets/methodology/how-rosmarops-works-es-narrow.svg assets/methodology/how-rosmarops-works-es-narrow.svg
          put site/assets/methodology/how-rosmarops-works-ca-wide.svg assets/methodology/how-rosmarops-works-ca-wide.svg
          put site/assets/methodology/how-rosmarops-works-ca-narrow.svg assets/methodology/how-rosmarops-works-ca-narrow.svg
          -mkdir assets/brand/observatory
          put site/assets/brand/observatory/observatory-favicon.ico assets/brand/observatory/observatory-favicon.ico
          put site/assets/brand/observatory/observatory-favicon.svg assets/brand/observatory/observatory-favicon.svg
          put site/assets/brand/observatory/observatory-apple-touch-180.png assets/brand/observatory/observatory-apple-touch-180.png

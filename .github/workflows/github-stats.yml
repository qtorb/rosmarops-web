name: GitHub stats (hourly)

# GTM-61 (signed by Albert, 01-11 08:40). The app.rosmarops.com panel read the GitHub API without credentials from the
# OVH shared hosting, where the per-IP limit runs out and the read failed almost daily (31-10 and 01-11). From now on
# GitHub Actions reads the public figures of qtorb/rosmarops with this workflow's own GITHUB_TOKEN and writes
# observatory/github-stats.json to main; the panel picks up that public file. If any of the four reads does not return
# 200, the run fails and writes nothing. GTM-184 (signed by Albert, 19-11 07:35, CTO-73 point 6): every hour instead of
# once a day. Four API requests per run, far below the GITHUB_TOKEN limit of 1,000 per hour per repository. The commit
# is pushed with that same token, and GitHub starts no workflow for a push made with it (the GitHub docs: «events
# triggered by the GITHUB_TOKEN ... will not create a new workflow run»), so neither observatory.yml, whose paths
# include observatory/**, nor deploy.yml, whose paths leave observatory/ out, runs for it.

on:
  schedule:
    - cron: "20 * * * *" # every hour at minute 20 (GTM-184); the space still finds a fresh file when it reads it at 06:30 Madrid (BA-78).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Read the public figures and write the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 observatory/github_stats.py "$RUNNER_TEMP/github-stats.json"
          python3 observatory/github_stats.py --check "$RUNNER_TEMP/github-stats.json"
          cp "$RUNNER_TEMP/github-stats.json" observatory/github-stats.json

      - name: Commit to main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observatory/github-stats.json
          git commit -m "github-stats: $(date -u +%F)"
          git push origin HEAD:main

name: Observatory (data, generator and output checks)

on:
  push:
    branches: [observatory, main]
    paths: ["observatory/**", "wp/pages/**", "site/index.html", "site/*/index.html", "site/methodology/**", "site/faq/**", "site/*/metodologia/**",
            "site/es/preguntas-frecuentes/**", "site/ca/preguntes-frequents/**", "site/llms.txt", "site/sample-report/**", "site/assets/observatory/**", "site/observatory/**", "site/es/observatorio/**", "site/ca/observatori/**", "wp/daily/**", "wp/mu-plugins/**", "wp/tests/**", ".github/workflows/observatory.yml"]
  pull_request:
    paths: ["observatory/**", "wp/daily/**", "wp/mu-plugins/**", "wp/tests/**", "wp/pages/**", "site/index.html", "site/*/index.html",
            "site/methodology/**", "site/faq/**", "site/*/metodologia/**", "site/es/preguntas-frecuentes/**", "site/ca/preguntes-frequents/**",
            "site/llms.txt", "site/sample-report/**", ".github/workflows/observatory.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GTM-106: test_map_data compares corrected agent fields with the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validator (CI only)
        run: pip install "jsonschema[format-nongpl]==4.23.0"

      - name: Validate the agent files against observatory.v1
        run: |
          python - <<'EOF'
          import glob, json, sys
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open("observatory/schema/observatory.v1.schema.json"))
          Draft202012Validator.check_schema(schema)
          v = Draft202012Validator(schema, format_checker=FormatChecker())
          files = sorted(glob.glob("observatory/data/agents/*.json")) + sorted(glob.glob("observatory/tests/fixture/*.json"))
          bad = 0
          for f in files:
              errors = sorted(v.iter_errors(json.load(open(f))), key=lambda e: list(e.path))
              for e in errors:
                  print(f"::error file={f}::{'/'.join(map(str, e.path)) or '(root)'}: {e.message}")
              bad += bool(errors)
              print(("FAIL " if errors else "ok   ") + f)
          sys.exit(1 if bad else 0)
          EOF

      - name: Validate the collector's raw files against raw.v1 (GTM-75)
        run: |
          python - <<'EOF'
          import glob, json, sys
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open("observatory/schema/raw.v1.schema.json"))
          Draft202012Validator.check_schema(schema)
          v = Draft202012Validator(schema, format_checker=FormatChecker())
          bad = 0
          for f in sorted(glob.glob("observatory/raw/*.json")):
              errors = sorted(v.iter_errors(json.load(open(f))), key=lambda e: list(e.path))
              for e in errors:
                  print(f"::error file={f}::{'/'.join(map(str, e.path)) or '(root)'}: {e.message}")
              bad += bool(errors)
              print(("FAIL " if errors else "ok   ") + f)
          sys.exit(1 if bad else 0)
          EOF

      - name: Generated pages are up to date
        run: |
          python observatory/build.py
          git status --porcelain -- site wp/daily wp/pages wp/mu-plugins/rosmarops-downloads.php
          test -z "$(git status --porcelain -- site wp/daily wp/pages wp/mu-plugins/rosmarops-downloads.php)" || { echo "::error::site/, wp/daily/, wp/pages/ or the download sources are out of date: run python3 observatory/build.py and commit"; exit 1; }

      - name: Agent lists agree with the agent files and the program's latest release (GTM-99)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python observatory/agent_lists.py check
          python observatory/map_page.py check

      - name: Daily synopsis checks and mu-plugin (GTM-23)
        run: |
          set -eu
          export OBS_BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          python -m unittest observatory/tests/test_daily_check.py observatory/tests/test_daily_alert.py observatory/tests/test_daily_raw.py observatory/tests/test_github_stats.py observatory/tests/test_collect.py observatory/tests/test_rules.py observatory/tests/test_agent_lists.py observatory/tests/test_map_data.py observatory/tests/test_map_page.py
          if ls observatory/daily/*.json >/dev/null 2>&1; then python observatory/daily_check.py observatory/daily/*.json; else echo "no daily files yet"; fi
          php -l wp/mu-plugins/rosmarops-daily.php
          python -m unittest wp/tests/test_daily.py
          php -l wp/mu-plugins/rosmarops-seo.php
          python -m unittest wp/tests/test_seo.py
          php -l wp/mu-plugins/rosmarops-retired.php
          python -m unittest wp/tests/test_retired.py
          php -l wp/mu-plugins/rosmarops-categories-gtm94.php
          python -m unittest wp/tests/test_categories_gtm94.py
          php -l wp/mu-plugins/rosmarops-gtm97-drafts.php
          python -m unittest wp/tests/test_gtm97_drafts.py
          php -l wp/mu-plugins/rosmarops-gtm103-noindex.php
          python -m unittest wp/tests/test_gtm103_noindex.py
          php -l wp/mu-plugins/rosmarops-downloads.php
          php -l wp/mu-plugins/rosmarops-blog-drafts.php
          python -m unittest wp/tests/test_blog_drafts.py
          php -l wp/mu-plugins/rosmarops-category-loop-engineering.php
          python -m unittest wp/tests/test_category_loop_engineering.py
          php -l wp/mu-plugins/rosmarops-gtm124-agente.php
          python -m unittest wp/tests/test_gtm124_agente.py
          php -l wp/mu-plugins/rosmarops-schedule-he-terminado.php
          python -m unittest wp/tests/test_schedule_he_terminado.py
          php -l wp/mu-plugins/rosmarops-schedule-microsoft-store.php
          python -m unittest wp/tests/test_schedule_microsoft_store.py
          php -l wp/mu-plugins/rosmarops-store-image.php
          python -m unittest wp/tests/test_store_image.py
          php -l wp/mu-plugins/rosmarops-schedule-mapa.php
          python -m unittest wp/tests/test_schedule_mapa.py
          python -m unittest wp/tests/test_download_sources.py
          python -m unittest wp/tests/test_static_about.py
          php -l wp/mu-plugins/rosmarops-consent.php
          python -m unittest wp/tests/test_consent_footer.py

      - name: Home download buttons by system, with the one-line check in Chromium (GTM-129, GTM-129b)
        run: |
          set -euo pipefail
          # Same Playwright as sample-captures.yml, installed for this check only.
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          NODE_PATH="$PWD/node_modules" python -m unittest -v wp/tests/test_download_os.py 2>&1 | tee /tmp/dlos.txt
          ! grep -q "skipped" /tmp/dlos.txt || { echo "::error::the one-line check was skipped"; exit 1; }

      - name: Download and visit counters against MySQL (GTM-18, GTM-111)
        run: |
          set -eu
          sudo systemctl start mysql
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wptest"
          DB_USER=root DB_PASS=root DB_NAME=wptest python -m unittest wp/tests/test_downloads.py wp/tests/test_visits.py

      - name: Publication rules hold in the output
        run: |
          set -eu
          for f in site/observatory/index.html site/es/observatorio/index.html site/ca/observatori/index.html; do
            ! grep -q 'name="robots" content="noindex"' "$f" || { echo "::error file=$f::index page must be indexable"; exit 1; }
          done
          for f in $(find site/observatory site/es/observatorio site/ca/observatori -mindepth 2 -name index.html); do
            url="https://rosmarops.com/${f#site/}"; url="${url%index.html}"
            if grep -q '<meta name="robots" content="noindex">' "$f"; then
              ! grep -q "<loc>$url</loc>" site/sitemap-pages.xml || { echo "::error file=$f::noindex page listed in the sitemap"; exit 1; }
            else
              grep -q "<loc>$url</loc>" site/sitemap-pages.xml || { echo "::error file=$f::published agent page missing from the sitemap"; exit 1; }
            fi
          done
          grep -q "https://rosmarops.com/observatory/" site/llms.txt
          grep -q "<loc>https://rosmarops.com/observatory/</loc>" site/sitemap-pages.xml
          echo "index pages indexable; agent pages either noindex and unlisted, or indexable and in the sitemap"

      - name: Agent page template renders (synthetic fixture)
        run: |
          python observatory/build.py --data observatory/tests/fixture --out "$RUNNER_TEMP/obs"
          for l in observatory es/observatorio ca/observatori; do
            test -f "$RUNNER_TEMP/obs/$l/example-agent/index.html"
            grep -q '"@type":"TechArticle"' "$RUNNER_TEMP/obs/$l/example-agent/index.html"
          done
          # GTM-89: an entry collected by the daily writer shows its own verification line in the three languages.
          grep -q "Collected automatically on 4 November 2026 from the official changelog." "$RUNNER_TEMP/obs/observatory/example-agent/index.html"
          grep -q "Recogido automáticamente el 4 de noviembre de 2026 del registro de cambios oficial." "$RUNNER_TEMP/obs/es/observatorio/example-agent/index.html"
          grep -q "Recollit automàticament el 4 de novembre de 2026 del registre de canvis oficial." "$RUNNER_TEMP/obs/ca/observatori/example-agent/index.html"

name: Sample report captures

# GTM-45 (signed by Albert, 30-10 09:09). Once a day, if qtorb/rosmarops has a new latest release with the sample
# reports, copies them to site/sample-report/, regenerates the eight captures in site/assets/sample/, updates the
# height attributes in the three sample report pages, cuts the eight home thumbnails (GTM-66) and records the tag
# in site/sample-report/VERSION.
# GTM-64 (signed by Albert, 01-11 15:50): it no longer writes to main. It pushes the result to the branch
# sample-report-<tag> and opens a PR with the 1280 and 390 px captures in its description; Albert merges it after
# looking at them, and the merge asks for the deploy as any other change to site/. If the branch already exists,
# nothing is done again. If the PR cannot be opened, the run fails and prints the link to open it by hand.
# GTM-99 (signed by Albert, 07-11): the same PR updates agent.rosmarops in the agent files from the release's
# internal/knowledge/ and the agent lists of the 13 pages. Only this repository's GITHUB_TOKEN and the public API.

on:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sample-captures
  cancel-in-progress: false

jobs:
  captures:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Latest release
        id: rel
        run: |
          set -eu
          tag=$(gh api repos/qtorb/rosmarops/releases/latest --jq .tag_name)
          current=$(tr -d '[:space:]' < site/sample-report/VERSION)
          echo "latest: $tag, site: $current"
          if [ "$tag" = "$current" ]; then
            echo "No new release"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets=$(gh api "repos/qtorb/rosmarops/releases/tags/$tag" --jq '.assets[].name')
          if ! echo "$assets" | grep -qx 'sample-report.en.html' || ! echo "$assets" | grep -qx 'sample-report.es.html'; then
            echo "::warning::Release $tag has no sample-report.en.html and sample-report.es.html; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "sample-report-$tag" >/dev/null; then
            echo "Branch sample-report-$tag already exists: its PR is waiting for Albert; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the sample reports
        if: steps.rel.outputs.new == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/sample-report"
          mkdir -p "$dir"
          gh release download "$TAG" -R qtorb/rosmarops -p 'sample-report.*.html' -D "$dir"
          cp "$dir/sample-report.en.html" "$dir/sample-report.es.html" site/sample-report/

      - name: Agent status and lists for the release (GTM-99)
        if: steps.rel.outputs.new == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eu
          # Agents with a knowledge file in this release become "evaluated" since it; the 13 pages and the Observatory
          # are generated again. What needs Albert (an unmapped knowledge file, an agent no longer scored) goes in the PR.
          python3 observatory/agent_lists.py release "$TAG" | tee "$RUNNER_TEMP/agents.txt"
          python3 observatory/build.py

      - name: Install Playwright, Chromium and optipng
        if: steps.rel.outputs.new == 'true'
        run: |
          set -eu
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y optipng

      - name: Captures and sizes
        if: steps.rel.outputs.new == 'true'
        run: |
          set -eu
          node tools/sample-captures/cap.js "$RUNNER_TEMP/sample-report" site/assets/sample
          optipng -o4 site/assets/sample/sample-desktop.en.png site/assets/sample/sample-desktop.en@2x.png \
            site/assets/sample/sample-desktop.es.png site/assets/sample/sample-desktop.es@2x.png \
            site/assets/sample/sample-mobile.en.png site/assets/sample/sample-mobile.en@2x.png \
            site/assets/sample/sample-mobile.es.png site/assets/sample/sample-mobile.es@2x.png
          python3 tools/sample-captures/update_sizes.py
          # GTM-66: the eight home thumbnails, cut from these captures.
          pip install "pillow==12.3.0"
          python3 tools/sample-captures/thumbs.py
          optipng -o4 site/assets/sample/sample-thumb*.png

      - name: Record the tag, push a branch and open a PR (Albert merges it)
        if: steps.rel.outputs.new == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eu
          branch="sample-report-$TAG"
          echo "$TAG" > site/sample-report/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add site/sample-report/VERSION site/sample-report/sample-report.en.html site/sample-report/sample-report.es.html \
            site/assets/sample/ site/index.html site/sample-report/index.html site/es/index.html \
            site/es/informe-de-ejemplo/index.html site/ca/index.html site/ca/informe-dexemple/index.html \
            observatory/data/agents site wp/daily wp/pages
          git commit -m "Sample report, captures and agent lists for $TAG (automatic, for review)"
          git push origin "$branch"
          raw="https://github.com/${GITHUB_REPOSITORY}/raw/$branch/site/assets/sample"
          {
            echo "New sample report from the release $TAG of qtorb/rosmarops, with its captures. Look at them before merging: merging asks for the deploy, which waits for Albert's approval."
            echo
            echo "1280 px (EN, ES):"
            echo
            echo "![1280 px EN]($raw/sample-desktop.en.png)"
            echo "![1280 px ES]($raw/sample-desktop.es.png)"
            echo
            echo "390 px (EN, ES):"
            echo
            echo "![390 px EN]($raw/sample-mobile.en.png) ![390 px ES]($raw/sample-mobile.es.png)"
            echo
            echo "Agents scored in $TAG (GTM-99), from internal/knowledge/ of the release:"
            echo
            if [ -s "$RUNNER_TEMP/agents.txt" ]; then sed 's/^/- /' "$RUNNER_TEMP/agents.txt"; else echo "- no change"; fi
          } > "$RUNNER_TEMP/pr.md"
          if ! gh pr create --base main --head "$branch" --title "Sample report and captures for $TAG" --body-file "$RUNNER_TEMP/pr.md"; then
            echo "::error::Could not open the PR. Open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...$branch"
            exit 1
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 839" width="358" height="839" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif">
<title>Com funciona RosmarOps</title>
<rect width="358" height="839" rx="16" fill="#F6F5F2"/>
<rect x="16" y="16" width="326" height="149" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="46" r="14" fill="#1B1A18"/>
<text x="46" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70" y="52" font-size="18" font-weight="700" fill="#1B1A18">Llegeix</text>
<text x="32" y="86.0" font-size="14" font-weight="400" fill="#3A3833">Mira la configuració dels agents d'IA</text>
<text x="32" y="106.3" font-size="14" font-weight="400" fill="#3A3833">del teu ordinador: assistents com</text>
<text x="32" y="126.6" font-size="14" font-weight="400" fill="#3A3833">Claude Code o Cursor que poden actuar</text>
<text x="32" y="146.9" font-size="14" font-weight="400" fill="#3A3833">per tu. Només mira; no canvia res.</text>
<path d="M179.0 169 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="189" width="326" height="149" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="219" r="14" fill="#1B1A18"/>
<text x="46" y="224" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="70" y="225" font-size="18" font-weight="700" fill="#1B1A18">Analitza</text>
<text x="32" y="259.0" font-size="14" font-weight="400" fill="#3A3833">Esbrina què pot fer cada agent: obrir</text>
<text x="32" y="279.3" font-size="14" font-weight="400" fill="#3A3833">els teus fitxers, fer servir les teves</text>
<text x="32" y="299.6" font-size="14" font-weight="400" fill="#3A3833">contrasenyes i claus d'accés o canviar</text>
<text x="32" y="319.9" font-size="14" font-weight="400" fill="#3A3833">la configuració d'un altre agent.</text>
<path d="M179.0 342 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="362" width="326" height="187" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="392" r="14" fill="#1B1A18"/>
<text x="46" y="397" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="70" y="398" font-size="18" font-weight="700" fill="#1B1A18">Puntua</text>
<text x="32" y="432.0" font-size="14" font-weight="400" fill="#3A3833">Cada agent rep una nota sobre 100.</text>
<text x="32" y="452.3" font-size="14" font-weight="400" fill="#3A3833">Vermell: pot arribar a molt. Verd: s'ha</text>
<text x="32" y="472.6" font-size="14" font-weight="400" fill="#3A3833">trobat poc o res. Les regles són</text>
<text x="32" y="492.9" font-size="14" font-weight="400" fill="#3A3833">públiques.</text>
<rect x="32.0" y="506.9" width="96.0" height="24" rx="4" fill="#FDECE7"/>
<text x="80.0" y="523.4" font-size="11" font-weight="600" fill="#94200B" text-anchor="middle">0–49</text>
<rect x="130.0" y="506.9" width="96.0" height="24" rx="4" fill="#FDF5DF"/>
<text x="178.0" y="523.4" font-size="11" font-weight="600" fill="#6B4700" text-anchor="middle">50–79</text>
<rect x="228.0" y="506.9" width="96.0" height="24" rx="4" fill="#E8F5EE"/>
<text x="276.0" y="523.4" font-size="11" font-weight="600" fill="#1A5532" text-anchor="middle">80–100</text>
<path d="M179.0 553 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="573" width="326" height="149" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="603" r="14" fill="#1B1A18"/>
<text x="46" y="608" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="70" y="609" font-size="18" font-weight="700" fill="#1B1A18">Explica</text>
<text x="32" y="643.0" font-size="14" font-weight="400" fill="#3A3833">Reps un informe al teu ordinador: què</text>
<text x="32" y="663.3" font-size="14" font-weight="400" fill="#3A3833">ha trobat, en paraules clares, i què</text>
<text x="32" y="683.6" font-size="14" font-weight="400" fill="#3A3833">cal canviar. Tu decideixes i fas el</text>
<text x="32" y="703.9" font-size="14" font-weight="400" fill="#3A3833">canvi.</text>
<rect x="16" y="738" width="326" height="85" rx="12" fill="#1B1A18"/>
<text x="32" y="766.0" font-size="14" font-weight="600" fill="#FFFFFF">Tot es queda al teu ordinador.</text>
<text x="32" y="786.3" font-size="14" font-weight="600" fill="#FFFFFF">RosmarOps no es connecta a internet i</text>
<text x="32" y="806.6" font-size="14" font-weight="600" fill="#FFFFFF">no envia res.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 383" width="760" height="383" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif">
<title>How RosmarOps works</title>
<rect width="760" height="383" rx="16" fill="#F6F5F2"/>
<rect x="16.0" y="16" width="164.0" height="271" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46.0" cy="46" r="14" fill="#1B1A18"/>
<text x="46.0" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70.0" y="52" font-size="18" font-weight="700" fill="#1B1A18">Reads</text>
<text x="32.0" y="86.0" font-size="14" font-weight="400" fill="#3A3833">It looks at the</text>
<text x="32.0" y="106.3" font-size="14" font-weight="400" fill="#3A3833">settings of the</text>
<text x="32.0" y="126.6" font-size="14" font-weight="400" fill="#3A3833">AI agents on your</text>
<text x="32.0" y="146.9" font-size="14" font-weight="400" fill="#3A3833">computer:</text>
<text x="32.0" y="167.2" font-size="14" font-weight="400" fill="#3A3833">assistants like</text>
<text x="32.0" y="187.5" font-size="14" font-weight="400" fill="#3A3833">Claude Code or</text>
<text x="32.0" y="207.8" font-size="14" font-weight="400" fill="#3A3833">Cursor that can</text>
<text x="32.0" y="228.1" font-size="14" font-weight="400" fill="#3A3833">act for you. It</text>
<text x="32.0" y="248.4" font-size="14" font-weight="400" fill="#3A3833">only looks; it</text>
<text x="32.0" y="268.7" font-size="14" font-weight="400" fill="#3A3833">changes nothing.</text>
<path d="M184.0 151.3 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="204.0" y="16" width="164.0" height="271" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="234.0" cy="46" r="14" fill="#1B1A18"/>
<text x="234.0" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="258.0" y="52" font-size="18" font-weight="700" fill="#1B1A18">Checks</text>
<text x="220.0" y="86.0" font-size="14" font-weight="400" fill="#3A3833">It works out what</text>
<text x="220.0" y="106.3" font-size="14" font-weight="400" fill="#3A3833">each agent is</text>
<text x="220.0" y="126.6" font-size="14" font-weight="400" fill="#3A3833">allowed to do:</text>
<text x="220.0" y="146.9" font-size="14" font-weight="400" fill="#3A3833">open your files,</text>
<text x="220.0" y="167.2" font-size="14" font-weight="400" fill="#3A3833">use your</text>
<text x="220.0" y="187.5" font-size="14" font-weight="400" fill="#3A3833">passwords and</text>
<text x="220.0" y="207.8" font-size="14" font-weight="400" fill="#3A3833">access keys, or</text>
<text x="220.0" y="228.1" font-size="14" font-weight="400" fill="#3A3833">change another</text>
<text x="220.0" y="248.4" font-size="14" font-weight="400" fill="#3A3833">agent's settings.</text>
<path d="M372.0 151.3 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="392.0" y="16" width="164.0" height="271" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="422.0" cy="46" r="14" fill="#1B1A18"/>
<text x="422.0" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="446.0" y="52" font-size="18" font-weight="700" fill="#1B1A18">Scores</text>
<text x="408.0" y="86.0" font-size="14" font-weight="400" fill="#3A3833">Each agent gets a</text>
<text x="408.0" y="106.3" font-size="14" font-weight="400" fill="#3A3833">score out of 100.</text>
<text x="408.0" y="126.6" font-size="14" font-weight="400" fill="#3A3833">Red: it can reach</text>
<text x="408.0" y="146.9" font-size="14" font-weight="400" fill="#3A3833">a lot. Green:</text>
<text x="408.0" y="167.2" font-size="14" font-weight="400" fill="#3A3833">little or nothing</text>
<text x="408.0" y="187.5" font-size="14" font-weight="400" fill="#3A3833">was found. The</text>
<text x="408.0" y="207.8" font-size="14" font-weight="400" fill="#3A3833">rules are public.</text>
<rect x="408.0" y="221.8" width="42.0" height="24" rx="4" fill="#FDECE7"/>
<text x="429.0" y="238.3" font-size="11" font-weight="600" fill="#94200B" text-anchor="middle">0–49</text>
<rect x="452.0" y="221.8" width="42.0" height="24" rx="4" fill="#FDF5DF"/>
<text x="473.0" y="238.3" font-size="11" font-weight="600" fill="#6B4700" text-anchor="middle">50–79</text>
<rect x="496.0" y="221.8" width="42.0" height="24" rx="4" fill="#E8F5EE"/>
<text x="517.0" y="238.3" font-size="11" font-weight="600" fill="#1A5532" text-anchor="middle">80–100</text>
<path d="M560.0 151.3 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="580.0" y="16" width="164.0" height="271" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="610.0" cy="46" r="14" fill="#1B1A18"/>
<text x="610.0" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="634.0" y="52" font-size="18" font-weight="700" fill="#1B1A18">Explains</text>
<text x="596.0" y="86.0" font-size="14" font-weight="400" fill="#3A3833">You get a report</text>
<text x="596.0" y="106.3" font-size="14" font-weight="400" fill="#3A3833">on your computer:</text>
<text x="596.0" y="126.6" font-size="14" font-weight="400" fill="#3A3833">what it found, in</text>
<text x="596.0" y="146.9" font-size="14" font-weight="400" fill="#3A3833">plain words, and</text>
<text x="596.0" y="167.2" font-size="14" font-weight="400" fill="#3A3833">what to change.</text>
<text x="596.0" y="187.5" font-size="14" font-weight="400" fill="#3A3833">You decide and</text>
<text x="596.0" y="207.8" font-size="14" font-weight="400" fill="#3A3833">make the change.</text>
<rect x="16" y="303" width="728" height="65" rx="12" fill="#1B1A18"/>
<text x="32" y="331.0" font-size="14" font-weight="600" fill="#FFFFFF">Everything stays on your computer. RosmarOps doesn't connect to the internet and sends</text>
<text x="32" y="351.3" font-size="14" font-weight="600" fill="#FFFFFF">nothing.</text>
</svg>

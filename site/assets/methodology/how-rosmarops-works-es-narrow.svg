<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 859" width="358" height="859" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif">
<title>Cómo funciona RosmarOps</title>
<rect width="358" height="859" rx="16" fill="#F6F5F2"/>
<rect x="16" y="16" width="326" height="149" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="46" r="14" fill="#1B1A18"/>
<text x="46" y="51" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70" y="52" font-size="18" font-weight="700" fill="#1B1A18">Lee</text>
<text x="32" y="86.0" font-size="14" font-weight="400" fill="#3A3833">Mira la configuración de los agentes de</text>
<text x="32" y="106.3" font-size="14" font-weight="400" fill="#3A3833">IA de tu ordenador: asistentes como</text>
<text x="32" y="126.6" font-size="14" font-weight="400" fill="#3A3833">Claude Code o Cursor que pueden actuar</text>
<text x="32" y="146.9" font-size="14" font-weight="400" fill="#3A3833">por ti. Solo mira; no cambia nada.</text>
<path d="M179.0 169 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="189" width="326" height="169" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="219" r="14" fill="#1B1A18"/>
<text x="46" y="224" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="70" y="225" font-size="18" font-weight="700" fill="#1B1A18">Analiza</text>
<text x="32" y="259.0" font-size="14" font-weight="400" fill="#3A3833">Averigua qué puede hacer cada agente:</text>
<text x="32" y="279.3" font-size="14" font-weight="400" fill="#3A3833">abrir tus archivos, usar tus</text>
<text x="32" y="299.6" font-size="14" font-weight="400" fill="#3A3833">contraseñas y claves de acceso o</text>
<text x="32" y="319.9" font-size="14" font-weight="400" fill="#3A3833">cambiar la configuración de otro</text>
<text x="32" y="340.2" font-size="14" font-weight="400" fill="#3A3833">agente.</text>
<path d="M179.0 362 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="382" width="326" height="187" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="412" r="14" fill="#1B1A18"/>
<text x="46" y="417" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="70" y="418" font-size="18" font-weight="700" fill="#1B1A18">Puntúa</text>
<text x="32" y="452.0" font-size="14" font-weight="400" fill="#3A3833">Cada agente recibe una nota sobre 100.</text>
<text x="32" y="472.3" font-size="14" font-weight="400" fill="#3A3833">Rojo: puede llegar a mucho. Verde: se</text>
<text x="32" y="492.6" font-size="14" font-weight="400" fill="#3A3833">ha encontrado poco o nada. Las reglas</text>
<text x="32" y="512.9" font-size="14" font-weight="400" fill="#3A3833">son públicas.</text>
<rect x="32.0" y="526.9" width="96.0" height="24" rx="4" fill="#FDECE7"/>
<text x="80.0" y="543.4" font-size="11" font-weight="600" fill="#94200B" text-anchor="middle">0–49</text>
<rect x="130.0" y="526.9" width="96.0" height="24" rx="4" fill="#FDF5DF"/>
<text x="178.0" y="543.4" font-size="11" font-weight="600" fill="#6B4700" text-anchor="middle">50–79</text>
<rect x="228.0" y="526.9" width="96.0" height="24" rx="4" fill="#E8F5EE"/>
<text x="276.0" y="543.4" font-size="11" font-weight="600" fill="#1A5532" text-anchor="middle">80–100</text>
<path d="M179.0 573 v14 m-6 -6 l6 6 l6 -6" fill="none" stroke="#66635D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="593" width="326" height="149" rx="12" fill="#FFFFFF" stroke="#E3E0D8"/>
<circle cx="46" cy="623" r="14" fill="#1B1A18"/>
<text x="46" y="628" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="70" y="629" font-size="18" font-weight="700" fill="#1B1A18">Explica</text>
<text x="32" y="663.0" font-size="14" font-weight="400" fill="#3A3833">Recibes un informe en tu ordenador: qué</text>
<text x="32" y="683.3" font-size="14" font-weight="400" fill="#3A3833">ha encontrado, en palabras claras, y</text>
<text x="32" y="703.6" font-size="14" font-weight="400" fill="#3A3833">qué cambiar. Tú decides y haces el</text>
<text x="32" y="723.9" font-size="14" font-weight="400" fill="#3A3833">cambio.</text>
<rect x="16" y="758" width="326" height="85" rx="12" fill="#1B1A18"/>
<text x="32" y="786.0" font-size="14" font-weight="600" fill="#FFFFFF">Todo se queda en tu ordenador.</text>
<text x="32" y="806.3" font-size="14" font-weight="600" fill="#FFFFFF">RosmarOps no se conecta a internet y no</text>
<text x="32" y="826.6" font-size="14" font-weight="600" fill="#FFFFFF">envía nada.</text>
</svg>
